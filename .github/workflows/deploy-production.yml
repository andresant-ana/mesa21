name: Publicar MESA21 na Cloudflare (manual)

# Intencionalmente NÃO dispara em push, PR nem agenda.
# A publicação continua desativada até liberar MESA21_RELEASE_APPROVED.
on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: "Digite PUBLICAR_MESA21 depois de aprovar os gates de lançamento"
        required: true
        type: string
      expected_sha:
        description: "Cole o SHA completo de main autorizado para publicação"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mesa21-production-deploy
  cancel-in-progress: false

jobs:
  preflight:
    # Três condições independentes: execução manual, main e liberação operacional.
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirm_release == 'PUBLICAR_MESA21' &&
      vars.MESA21_RELEASE_APPROVED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirmar commit autorizado
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$EXPECTED_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::O SHA autorizado precisa corresponder exatamente ao commit em main."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run check
      - name: Testes de domínio e API
        run: npm test
      - name: Build de frontend
        run: npm run build
      - name: Dry-run de Worker de produção
        run: npm run deploy:check
      - name: Integração Worker / Durable Objects
        run: npm run smoke
      - name: Preparar Chromium
        run: npx playwright install --with-deps chromium
      - name: Fluxos reais no navegador
        run: npm run ui-smoke

  publish:
    needs: preflight
    if: >-
      needs.preflight.result == 'success' &&
      vars.MESA21_RELEASE_APPROVED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Criar/proteger este Environment no GitHub antes de liberar o deploy.
    # Manter o token SOMENTE nos secrets do environment, não no repositório.
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Construir assets
        run: npm run build
      - name: Conferir credenciais de ambiente sem expô-las
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]] || [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::Configure o token restrito e o account ID no environment production antes de publicar."
            exit 1
          fi
      - name: Publicar somente após todas as verificações e aprovação do environment
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deploy --env production
